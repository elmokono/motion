daemon off

log_file /var/log/motion/motion.log
log_level 6

target_dir /media/ramdisk

# --- Flujos de Cámara ---
# Substream (800x448) para el motor de detección de movimiento
netcam_url rtsp://192.168.0.158:554/user=daniel_password=XXXXXXXXXXXXXXX_channel=0_stream=1?real_stream

# Mainstream (1080p) para la grabación de video final
netcam_high_url rtsp://192.168.0.158:554/user=daniel_password=XXXXXXXXXXXXXXX_channel=0_stream=0?real_stream

# Dimensiones aplicadas al substream (análisis y webstream)
width 800
height 448
framerate 12

# --- Parámetros de Detección Optimizados ---
# Reducido de 2000 a 600 para detectar personas más lejanas o movimientos rápidos
threshold 600

# Se mantiene en 2 cuadros para confirmar movimiento real y no falsos flashes
minimum_motion_frames 2

# Segundos de silencio para cerrar un evento
event_gap 5

# Guardar 1 a 2 segundos ANTES del movimiento (25 a 50 frames a 25fps)
pre_capture 30
post_capture 30

# Filtro despeckle más suave para no disolver siluetas distantes
despeckle_filter Eed

# Desactivamos noise_tune dinámico para evitar descalibraciones falsas
noise_level 32
noise_tune off

# --- Grabación de Video HD ---
movie_output on
movie_max_time 60
movie_codec mp4
movie_quality 0

# Habilita la captura directa de los paquetes HD sin re-codificar (ahorra CPU)
movie_passthrough on

netcam_params keepalive=on
#netcam_tolerant_check on

on_movie_end /etc/motion/camaras.sh %f

# --- Stream Web y Control ---
stream_port 8081
stream_localhost off

webcontrol_port 8080
webcontrol_localhost off
