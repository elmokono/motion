# Pisa /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# RPi OS usa volatile para no desgastar la SD; necesitamos logs que
# sobrevivan al reinicio para diagnosticar cortes de luz.
# El limite de tamano acota el desgaste.
[Journal]
Storage=persistent
SystemMaxUse=100M
SystemMaxFileSize=20M
MaxRetentionSec=1month
