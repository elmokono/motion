<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Sin esto el movil renderiza a ~980px y escala todo hacia abajo: las media
         queries de abajo nunca llegarian a aplicarse. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Motion TV Dashboard</title>
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        h2 { margin-top: 0; font-weight: 400; color: #bb86fc; text-align: center; font-size: 22px; margin-bottom: 5px; }
        
        #filters-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; background: #1e1e1e; padding: 10px; border-radius: 8px; align-items: center; flex-wrap: wrap; }
        .filter-label { font-size: 16px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
        .filter-checkbox { transform: scale(1.3); cursor: pointer; accent-color: #03dac6; }

        #toggle-panel-btn { background: #2c2c2c; color: #03dac6; border: 2px solid #03dac6; border-radius: 6px; padding: 6px 12px; font-size: 16px; cursor: pointer; font-weight: bold; margin-left: auto; }
        #toggle-panel-btn:focus, #toggle-panel-btn:hover { background: #3d3d3d; }

        #main-layout { display: flex; flex: 1; gap: 15px; overflow: hidden; }
        #left-column { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        #video-container { position: relative; flex: 1; display: flex; justify-content: center; align-items: center; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); min-height: 200px; }
        video { max-width: 100%; max-height: 100%; outline: none; }
        
        #loading-spinner {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #03dac6;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            z-index: 10;
        }
        .spinner-ring {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(3, 218, 198, 0.2);
            border-top: 5px solid #03dac6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #metadata-panel { background: #1e1e1e; padding: 12px; border-radius: 8px; margin: 10px 0; display: flex; flex-direction: column; gap: 8px; min-height: 60px;}
        #desc-text { font-size: 18px; margin: 0; color: #e0e0e0; }
        #badges-container { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge { padding: 3px 10px; border-radius: 20px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .badge-persona { background-color: #cf6679; color: #000; }
        .badge-animal { background-color: #ffb300; color: #000; }
        .badge-bebe { background-color: #40c4ff; color: #000; }
        .badge-vegetacion { background-color: #4caf50; color: #000; }
        .badge-vacio { background-color: #333; color: #aaa; }
        /* Sospechoso = persona detectada con la camara en modo nocturno/IR. */
        .badge-sospechoso { background-color: #ff1744; color: #fff; animation: alarma 1.6s ease-in-out infinite; }
        @keyframes alarma { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
        @media (prefers-reduced-motion: reduce) { .badge-sospechoso { animation: none; } }

        #tv-controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .tv-btn { background-color: #2c2c2c; color: #ffffff; border: 4px solid transparent; border-radius: 10px; padding: 12px 25px; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; }
        .tv-btn:focus, .tv-btn:hover { border-color: #03dac6; background-color: #3d3d3d; outline: none; transform: scale(1.05); color: #03dac6; }
        
        #timeline { width: 100%; height: 160px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
        
        .vis-item { 
            background-color: #2d2b55; border: 2px solid #bb86fc; color: #ffffff; font-weight: bold; 
            border-radius: 6px; font-size: 15px; padding: 4px 10px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .vis-item.vis-selected { background-color: #03dac6; border-color: #ffffff; color: #000000; }
        .vis-time-axis .vis-text { color: #aaa; font-size: 13px; }
        .vis-timeline { border: none; }

        #right-panel { width: 380px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; transition: width 0.3s ease, opacity 0.3s ease; }
        #right-panel.collapsed { width: 0; opacity: 0; border: none; }
        
        #right-panel-header { background: #252525; padding: 12px; font-weight: bold; font-size: 18px; color: #bb86fc; border-bottom: 1px solid #333; text-align: center; }
        #events-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        
        .event-card { background: #282828; padding: 10px 12px; border-radius: 6px; cursor: pointer; border-left: 4px solid #bb86fc; transition: background 0.2s; }
        .event-card:hover, .event-card:focus { background: #383838; border-left-color: #03dac6; outline: none; }
        .event-card.active { background: #32314a; border-left-color: #03dac6; }
        .event-card.sospechoso { border-left-color: #ff1744; border-left-width: 6px; }
        .vis-item.evt-sospechoso { background-color: #4a0d18; border-color: #ff1744; }
        
        .event-card-header { font-size: 13px; color: #888; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .event-card-title { font-weight: bold; font-size: 15px; color: #fff; margin-bottom: 4px; }
        .event-card-desc { font-size: 13px; color: #ccc; line-height: 1.3; }
        #refresh-status { font-size: 13px; color: #888; margin-left: auto; white-space: nowrap; transition: color .3s; }
        #refresh-status.nuevos { color: #03dac6; font-weight: bold; }
        #refresh-status.error { color: #cf6679; }

        /* ---------- MOVIL EN VERTICAL ----------
           El panel lateral pasa a apilarse DEBAJO del reproductor, que asi ocupa
           todo el ancho. El layout de escritorio/TV queda intacto: solo aplica en
           pantallas angostas con orientacion vertical. */
        @media (max-width: 900px) and (orientation: portrait) {
            /* En horizontal el body es una caja fija de 100vh sin scroll. Apilado
               necesitamos que la pagina crezca y se pueda desplazar hasta el panel. */
            html, body { max-width: 100%; overflow-x: hidden; }
            body { height: auto; min-height: 100vh; overflow-y: auto; padding: 10px; }

            /* Los items flex traen min-width:auto, asi que se niegan a achicarse por
               debajo de su contenido y estiran al padre. vis-timeline es el peor caso:
               se autodimensiona en pixeles y arrastraba todo el layout a ~600px. */
            #main-layout, #left-column, #right-panel, #video-container,
            #metadata-panel, #tv-controls, #timeline, #events-list {
                min-width: 0; max-width: 100%;
            }
            #timeline { overflow: hidden; }
            #desc-text, .event-card-desc, .event-card-title { overflow-wrap: anywhere; }

            #main-layout { flex-direction: column; overflow: visible; gap: 10px; }

            /* La timeline es hija de #left-column y la lista es hermana de ese
               contenedor, asi que 'order' por si solo no puede intercalarlas: solo
               ordena entre hermanos del mismo flex container. Con display:contents
               la caja de #left-column desaparece y sus hijos pasan a ser items
               directos de #main-layout, ya ordenables entre si. */
            #left-column { display: contents; }

            #video-container { order: 1; }
            #metadata-panel  { order: 2; margin: 0; }
            #tv-controls     { order: 3; margin-bottom: 0; }
            #right-panel     { order: 4; }
            #timeline        { order: 5; }

            /* Ancho completo y caja 16:9 fija (las grabaciones son 2560x1440).
               Sin esto el contenedor, que era flex:1, colapsaria al no haber altura. */
            #video-container { flex: none; width: 100%; aspect-ratio: 16 / 9; min-height: 0; }
            video { width: 100%; height: 100%; object-fit: contain; }

            /* Ya no es una columna lateral: ocupa el ancho y limita su alto para no
               empujar la timeline fuera de alcance. La lista scrollea por dentro. */
            #right-panel { width: 100%; max-height: 50vh; }
            /* El toggle colapsa por ancho; apilado hay que colapsar por alto. */
            #right-panel.collapsed { width: 100%; max-height: 0; height: 0; opacity: 0; border: none; }

            /* Tamanos pensados para TV, reducidos para la mano. */
            h2 { font-size: 18px; }
            #filters-container { gap: 10px; padding: 8px; }
            .filter-label { font-size: 14px; }
            /* Una sola fila siempre: nowrap en el contenedor y flex:1 1 0 en los
               botones, que asi reparten el ancho en partes iguales y se achican
               juntos en vez de saltar de linea. */
            #tv-controls { gap: 6px; flex-wrap: nowrap; }
            .tv-btn {
                padding: 9px 6px; font-size: 13px; border-width: 2px;
                flex: 1 1 0; min-width: 0; white-space: nowrap;
            }
            /* El scale del focus desbordaba la fila al no haber margen sobrante. */
            .tv-btn:focus, .tv-btn:hover { transform: none; }
            /* No bajar de 160px: es la altura que el JS le pasa a vis-timeline. Con el
               contenedor mas corto, el overflow:hidden de arriba recorta el eje de horas. */
            #desc-text { font-size: 15px; }
            .badge { font-size: 12px; padding: 3px 8px; gap: 4px; }
            #badges-container { gap: 6px; }
            #refresh-status { margin-left: 0; }
        }
    </style>
</head>
<body>
    <h2>Motion TV Dashboard</h2>

    <div id="filters-container">
        <label class="filter-label"><input type="checkbox" id="chk-sospechoso" class="filter-checkbox" checked> 🚨 Sospechoso</label>
        <label class="filter-label"><input type="checkbox" id="chk-personas" class="filter-checkbox" checked> 🚶‍♂️ Personas</label>
        <label class="filter-label"><input type="checkbox" id="chk-bebes" class="filter-checkbox" checked> 👶 Bebés</label>
        <label class="filter-label"><input type="checkbox" id="chk-animales" class="filter-checkbox" checked> 🐕 Animales</label>
        <label class="filter-label"><input type="checkbox" id="chk-vegetacion" class="filter-checkbox"> 🌿 Vegetación</label>
        <label class="filter-label"><input type="checkbox" id="chk-otros" class="filter-checkbox"> ✨ Otros / Vacío</label>
        <button id="toggle-panel-btn" tabindex="4">📋 Lista ⇄</button>
        <span id="refresh-status" title="La lista se actualiza sola cada minuto">⟳ —</span>
    </div>
    
    <div id="main-layout">
        <div id="left-column">
            <div id="video-container">
                <div id="loading-spinner">
                    <div class="spinner-ring"></div>
                    <span>Cargando video...</span>
                </div>
                <video id="player" controls>
                    <source src="" type="video/mp4">
                </video>
            </div>

            <div id="metadata-panel">
                <p id="desc-text">Cargando...</p>
                <div id="badges-container"></div>
            </div>

            <div id="tv-controls">
                <button id="btn-prev" class="tv-btn" tabindex="1">⏮ Anterior</button>
                <button id="btn-play" class="tv-btn" tabindex="2">⏯ Pausa / Play</button>
                <button id="btn-next" class="tv-btn" tabindex="3">Siguiente ⏭</button>
            </div>

            <div id="timeline"></div>
        </div>

        <div id="right-panel">
            <div id="right-panel-header">Historial (Top 100 Recientes)</div>
            <div id="events-list"></div>
        </div>
    </div>

    <script>
        let allEvents = [];
        let currentFilteredEvents = [];
        let currentIndex = -1;
        let timeline;
        const player = document.getElementById('player');
        const descText = document.getElementById('desc-text');
        const badgesContainer = document.getElementById('badges-container');
        const eventsListContainer = document.getElementById('events-list');
        const rightPanel = document.getElementById('right-panel');
        const loadingSpinner = document.getElementById('loading-spinner');

        // Persona detectada con la camara en modo nocturno/IR. La regla vive solo aca
        // (no se persiste en el JSON del tagger) para poder ajustarla sin re-etiquetar.
        // Ojo: los videos etiquetados antes del 2026-09-17 no traen vision_nocturna,
        // asi que nunca dan sospechoso.
        function esSospechoso(e) {
            return !!(e.metadata && e.metadata.vision_nocturna && e.metadata.hay_personas);
        }

        player.addEventListener('waiting', () => { loadingSpinner.style.display = 'flex'; });
        player.addEventListener('playing', () => { loadingSpinner.style.display = 'none'; });
        player.addEventListener('canplay', () => { loadingSpinner.style.display = 'none'; });

        document.getElementById('toggle-panel-btn').addEventListener('click', () => {
            rightPanel.classList.toggle('collapsed');
        });

        function loadVideo(index) {
            if (index < 0 || index >= currentFilteredEvents.length) return;
            currentIndex = index;
            const event = currentFilteredEvents[currentIndex];
            
            loadingSpinner.style.display = 'flex';
            player.src = event.video_url;
            player.play().catch(() => { loadingSpinner.style.display = 'none'; });
            
            timeline.setSelection(event.id);
            
            const eventTime = new Date(event.start).getTime();
            const fifteenMinutes = 15 * 60 * 1000;
            timeline.setWindow(new Date(eventTime - fifteenMinutes), new Date(eventTime + fifteenMinutes), { animation: true });

            document.querySelectorAll('.event-card').forEach((card) => {
                if (card.dataset.eventId == event.id) {
                    card.classList.add('active');
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    card.classList.remove('active');
                }
            });

            if (event.metadata && Object.keys(event.metadata).length > 0) {
                descText.innerText = event.metadata.descripcion || "Sin descripción detallada.";
                
                let badgesHtml = '';
                if (esSospechoso(event)) {
                    // Reemplaza al de Personas: seria redundante mostrar los dos.
                    badgesHtml += '<div class="badge badge-sospechoso">🚨 Sospechoso</div>';
                } else if (event.metadata.hay_personas) {
                    badgesHtml += '<div class="badge badge-persona">🚶‍♂️ Personas</div>';
                }
                // El de bebe si se suma al de personas: son datos distintos y util verlos juntos.
                if (event.metadata.hay_bebes) {
                    badgesHtml += '<div class="badge badge-bebe">👶 Bebé</div>';
                }
                if (event.metadata.hay_animales) {
                    badgesHtml += '<div class="badge badge-animal">🐕 Animal</div>';
                }
                if (event.metadata.movimiento_vegetacion) {
                    badgesHtml += '<div class="badge badge-vegetacion">🌿 Vegetación</div>';
                }
                if (!event.metadata.hay_personas && !event.metadata.hay_animales &&
                    !event.metadata.hay_bebes && !event.metadata.movimiento_vegetacion) {
                    badgesHtml += '<div class="badge badge-vacio">✨ Otros</div>';
                }
                badgesContainer.innerHTML = badgesHtml;
            } else {
                descText.innerText = "No hay metadata JSON para este video.";
                badgesContainer.innerHTML = '';
            }
        }

        function renderEventsList() {
            eventsListContainer.innerHTML = '';
            const top100Events = [...currentFilteredEvents]
                .sort((a, b) => new Date(b.start) - new Date(a.start))
                .slice(0, 100);

            top100Events.forEach((event, index) => {
                const card = document.createElement('div');
                card.className = 'event-card' + (esSospechoso(event) ? ' sospechoso' : '');
                card.dataset.eventId = event.id;
                card.tabIndex = 5 + index;

                const yyyy = event.year;
                const mm = String(event.month).padStart(2, '0');
                const dd = String(event.day).padStart(2, '0');
                const hh = String(event.hour).padStart(2, '0');
                const min = String(event.minute).padStart(2, '0');
                const ss = String(event.second).padStart(2, '0');
                const dateStr = `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;

                // Franja horaria segun la hora del evento: 08:00-19:59 dia, resto noche.
                // Es independiente de vision_nocturna, que es lo que ve la camara (IR).
                const iconoHorario = (event.hour >= 8 && event.hour < 20) ? '☀️' : '🌙';

                let summaryType = event.metadata?.evento_principal || "Evento de Cámara";
                if (esSospechoso(event)) summaryType = "🚨 Sospechoso";
                else if (event.metadata?.hay_bebes) summaryType = "Bebé Detectado";
                else if (event.metadata?.hay_personas) summaryType = "Personas Detectadas";
                else if (event.metadata?.hay_animales) summaryType = "Animal Detectado";
                else if (event.metadata?.movimiento_vegetacion) summaryType = "Movimiento Vegetación";

                const descSnippet = event.metadata?.descripcion || "Sin descripción.";

                card.innerHTML = `
                    <div class="event-card-header">
                        <span>${dateStr}</span>
                        <span>Cam ${event.cam_id || ''}</span>
                    </div>
                    <div class="event-card-title">${iconoHorario} ${summaryType}</div>
                    <div class="event-card-desc">${descSnippet}</div>
                `;

                const handleSelect = () => {
                    const realIndex = currentFilteredEvents.findIndex(e => e.id === event.id);
                    if (realIndex !== -1) loadVideo(realIndex);
                };

                card.addEventListener('click', handleSelect);
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleSelect();
                });

                eventsListContainer.appendChild(card);
            });
        }

        // Marca un evento como activo (seleccion + tarjeta) SIN tocar el reproductor
        // ni la ventana de la timeline. Es lo que permite refrescar sin cortar lo
        // que estas viendo ni perder el zoom.
        function markActive(index) {
            currentIndex = index;
            const event = currentFilteredEvents[index];
            if (!event) return;
            try { timeline.setSelection(event.id); } catch (_) {}
            document.querySelectorAll('.event-card').forEach((card) => {
                card.classList.toggle('active', card.dataset.eventId == event.id);
            });
        }

        function applyFilters(opts) {
            const preserve = opts && opts.preserve;
            // Los id que manda el backend se corren cuando aparecen videos nuevos,
            // asi que para reencontrar el evento actual usamos video_url, que es estable.
            const prevUrl = (currentIndex >= 0 && currentFilteredEvents[currentIndex])
                ? currentFilteredEvents[currentIndex].video_url
                : null;

            const showSospechoso = document.getElementById('chk-sospechoso').checked;
            const showBebes = document.getElementById('chk-bebes').checked;
            const showPersonas = document.getElementById('chk-personas').checked;
            const showAnimales = document.getElementById('chk-animales').checked;
            const showVegetacion = document.getElementById('chk-vegetacion').checked;
            const showOtros = document.getElementById('chk-otros').checked;

            currentFilteredEvents = allEvents.filter(e => {
                const hasS = esSospechoso(e);
                const hasB = !hasS && e.metadata && e.metadata.hay_bebes;
                // Sospechoso y Bebe dejan de contar como "Personas": asi, destildando
                // Personas, cada filtro aisla lo suyo en vez de quedar tapado.
                const hasP = !hasS && !hasB && e.metadata && e.metadata.hay_personas;
                const hasA = e.metadata && e.metadata.hay_animales;
                const hasV = e.metadata && e.metadata.movimiento_vegetacion;
                const isOther = !hasS && !hasB && !hasP && !hasA && !hasV;

                if (hasS && showSospechoso) return true;
                if (hasB && showBebes) return true;
                if (hasP && showPersonas) return true;
                if (hasA && showAnimales) return true;
                if (hasV && showVegetacion) return true;
                if (isOther && showOtros) return true;
                return false;
            });

            itemsDataSet.clear();
            itemsDataSet.add(currentFilteredEvents);
            renderEventsList();

            if (currentFilteredEvents.length === 0) {
                currentIndex = -1;
                player.pause();
                player.src = "";
                loadingSpinner.style.display = 'none';
                descText.innerText = "No hay eventos que coincidan con los filtros seleccionados.";
                badgesContainer.innerHTML = "";
                return;
            }

            // En un refresco automatico seguimos en el mismo video: solo reubicamos
            // la seleccion. Si el evento desaparecio, recien ahi saltamos al ultimo.
            if (preserve && prevUrl) {
                const idx = currentFilteredEvents.findIndex(e => e.video_url === prevUrl);
                if (idx !== -1) { markActive(idx); return; }
            }

            loadVideo(0);
        }

        // Envueltos en arrow function: si se pasara applyFilters directo recibiria
        // el objeto Event como opciones.
        ['chk-sospechoso', 'chk-bebes', 'chk-personas', 'chk-animales', 'chk-vegetacion', 'chk-otros'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => applyFilters());
        });

        document.getElementById('btn-prev').addEventListener('click', () => loadVideo(currentIndex + 1));
        document.getElementById('btn-next').addEventListener('click', () => loadVideo(currentIndex - 1));
        
        document.getElementById('btn-play').addEventListener('click', () => {
            if (player.paused) player.play();
            else player.pause();
        });

        let itemsDataSet;

        const REFRESH_MS = 60000;
        let refreshing = false;
        const statusEl = document.getElementById('refresh-status');

        function decorate(e) {
            let icons = "";
            const sosp = esSospechoso(e);
            if (e.metadata) {
                if (sosp) icons += " 🚨";
                else if (e.metadata.hay_personas) icons += " 🚶‍♂️";
                if (e.metadata.hay_bebes) icons += " 👶";
                if (e.metadata.hay_animales) icons += " 🐕";
                if (e.metadata.movimiento_vegetacion) icons += " 🌿";
            }
            e.content = `Cam ${e.cam_id || ''}` + icons;
            // vis-timeline pinta el item con esta clase (ver .vis-item.evt-sospechoso).
            e.className = sosp ? 'evt-sospechoso' : undefined;
        }

        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = cls || '';
        }

        // Refresco automatico: vuelve a pedir /api/events y rearma lista y timeline
        // conservando filtros, video en reproduccion, posicion y zoom.
        function refreshEvents() {
            if (refreshing) return;
            refreshing = true;
            fetch('/api/events')
                .then(r => r.json())
                .then(data => {
                    data.forEach(decorate);
                    const conocidos = new Set(allEvents.map(e => e.video_url));
                    const nuevos = data.filter(e => !conocidos.has(e.video_url)).length;
                    allEvents = data.sort((a, b) => new Date(b.start) - new Date(a.start));
                    applyFilters({ preserve: true });
                    const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                    if (nuevos > 0) setStatus(`⟳ ${hora} · ${nuevos} nuevo${nuevos > 1 ? 's' : ''}`, 'nuevos');
                    else setStatus(`⟳ ${hora}`, '');
                })
                .catch(() => setStatus('⟳ sin conexión', 'error'))
                .finally(() => { refreshing = false; });
        }

        fetch('/api/events')
            .then(response => response.json())
            .then(data => {
                data.forEach(decorate);

                allEvents = data.sort((a, b) => new Date(b.start) - new Date(a.start));
                
                const container = document.getElementById('timeline');
                itemsDataSet = new vis.DataSet([]);
                
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(endDate.getDate() - 7);

                const options = {
                    height: '160px',
                    start: startDate,
                    end: endDate,
                    zoomMin: 1000 * 60 * 2,
                    zoomMax: 1000 * 60 * 60 * 24 * 30,
                    format: { minorLabels: { minute: 'h:mma', hour: 'ha', day: 'D MMM' } }
                };
                timeline = new vis.Timeline(container, itemsDataSet, options);

                timeline.on('select', function (properties) {
                    if (properties.items.length > 0) {
                        const selectedId = properties.items[0];
                        const clickedIndex = currentFilteredEvents.findIndex(e => e.id === selectedId);
                        if (clickedIndex !== -1) {
                            loadVideo(clickedIndex);
                        }
                    }
                });

                applyFilters();
                setStatus('⟳ ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }), '');

                // vis-timeline fija su ancho en pixeles al construirse. Al rotar el
                // telefono hay que pedirle que se recalcule o queda con el ancho viejo.
                let redrawT;
                const redrawTimeline = () => {
                    clearTimeout(redrawT);
                    redrawT = setTimeout(() => { try { timeline.redraw(); } catch (_) {} }, 150);
                };
                window.addEventListener('resize', redrawTimeline);
                window.addEventListener('orientationchange', redrawTimeline);

                setInterval(refreshEvents, REFRESH_MS);
                // Si la pestaña estuvo en segundo plano, al volver refrescamos ya.
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) refreshEvents();
                });
            });
    </script>
</body>
</html>
